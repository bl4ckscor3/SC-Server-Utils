plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
	id 'net.neoforged.moddev' version '2.0.115'
}

version = '1.20'
group = 'bl4ckscor3.mod.scserverutils'

base {
	archivesName = 'scserverutils-1.21.8'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
	version = "21.8.49"

	runs {
		configureEach {
			logLevel = org.slf4j.event.Level.DEBUG
			gameDirectory = project.file("runs/" + name)
			ideName = "SCServerUtils " + ideName.get()
		}

		client {
			client()
		}

		server {
			server()
			programArgument('-nogui')
		}
	}

	mods {
		scserverutils {
			sourceSet(sourceSets.main)
		}
	}
}

repositories {
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    implementation "curse.maven:security-craft-64760:7148577"

    implementation "curse.maven:craterlib-867099:6662981"
    implementation "curse.maven:simple-discord-link-bot-forge-fabric-spigot-541320:6979135"
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title": "SC Server Utils",
                    "Specification-Vendor": "bl4ckscor3",
                    "Specification-Version": "${version}",
                    "Implementation-Title": "SC Server Utils",
                    "Implementation-Version": "${version}",
                    "Implementation-Vendor": "bl4ckscor3"])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	options.release = 21
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}